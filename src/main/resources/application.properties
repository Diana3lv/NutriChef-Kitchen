# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=nutrichef
quarkus.datasource.password=nutrichef123
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/nutrichef_db

# Hibernate ORM Configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# JWT Configuration
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem
mp.jwt.verify.issuer=https://nutrichef.io

# Groq API Configuration (free API key from: https://console.groq.com)
groq.api.key=${MY_GROQ_API_KEY}

# Spoonacular API Configuration (optional, for nutrition data)
# Get free API key from: https://spoonacular.com/food-api
spoonacular.api.key=${SPOONACULAR_API_KEY:}

# Application Configuration
quarkus.http.port=8080
quarkus.log.console.enable=true
quarkus.log.console.level=INFO